# The labels this repository defines for itself.
#
# NOTHING RUNS OVER THIS FILE. `.github/workflows/sync-labels.yaml` handed it to
# a label sync alongside the shared plugin set until #327 removed that workflow,
# on the decision taken on share-links#338, and no run has read it since:
#
#     git ls-files .github/workflows/ | grep -c sync-labels
#     0
#
# What it has instead is one named reader and no run behind it.
# `.github/workflows/publish.yaml` names this file as the authority for the
# labels its alert asks for, and that is a reader in prose rather than a route:
# the workflow passes label names as literals, parses nothing here, and a name it
# passes that is not on the board fails the whole `gh issue create` call rather
# than the label, which was found by the probe recorded on #310.
#
#     git grep -n 'labels.yaml' -- .github/workflows/publish.yaml
#
# The shared set is NOT copied in here. This file holds only what this board
# added on top, so it cannot drift against a set it does not restate. Before the
# set was passed to the sync beside it, every label below was one that sync would
# have deleted, which is #196.
#
# The colours and descriptions are the ones these labels carried when they were
# written down, read off the board rather than chosen again:
#
#     gh label list --repo Flowfin/jellyfin-plugin-watchlist --limit 100 \
#       --json name,color,description --jq '.[] | "\(.name)\t\(.color)\t\(.description)"'
#
# NOTHING DELETES A LABEL HERE, AND THIS FILE PROMISED THAT SOMETHING DID. The
# sentence stood until #338 and said an undeclared label was deleted on the next
# scheduled run. There is no scheduled run. A label added to the board and not
# written down below is carried by the board, declared nowhere, and reported by
# nothing. Add it here in the same change that creates it, because nothing else
# will notice that you did not.
#
# WHETHER THIS FILE SHOULD BE COMPARED AGAINST THE BOARD BY ANYTHING AT ALL IS
# OPEN. #338 leaves it open rather than answering it, and nothing has answered it
# since. What is no longer open is whether the file AGREES with the board on the
# `blocked-on-` family; it does, and the two readings say so:
#
#     gh label list --repo Flowfin/jellyfin-plugin-watchlist --limit 100 \
#       --json name --jq '[.[].name | select(startswith("blocked-on-"))] | length'
#     4
#
#     grep -c '^- name: blocked-on-' .github/labels.yaml
#     4
#
# THE FOURTH MEMBER STOOD ON THE BOARD AND NOT ON THIS PAGE FOR FIVE DAYS, AND
# THIS PARAGRAPH SAID THE ELISION WAS DELIBERATE AND WOULD STAY. It was
# deliberate, and the reason was real rather than a preference: `docs/parity.md`
# pastes a count of that name in this file, `DocumentPasteTests` re-runs the
# paste, and adding the member reds that guard at `docs/parity.md:731`, where the
# count stood under the answer `0`. #343 measured that rather than asserting it,
# and could not repair it because its own `Scope:` reached this file alone.
#
# WHAT MOVED IS THE DECISION AND NOT THE MEASUREMENT. #349 carries both files, and
# the question #196 left open - whether this board keeps a vocabulary of its own
# at all rather than moving onto the shared plugin set - was answered on
# 2026-09-06 in the direction that keeps it: the `blocked-on-` family is this
# fleet's vocabulary, the fleet's routes read it by its prefix, and a board
# carrying a member it does not declare is the divergence rather than the cure.
# So the member is declared below and the paste in `docs/parity.md` was taken
# again in the same change, which is why neither file is red between two merges.

