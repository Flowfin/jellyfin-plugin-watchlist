# Saying that an issue is waiting, so the same absence is not read again on the
# next pass.
#
# An issue that cannot move looks exactly like an issue nobody has picked up.
# Nothing on this board separated the two until this family existed, and what
# each pass over the tracker produced instead was another comment saying the
# same issue is blocked. Thirty-six such comments stood across nineteen open
# issues when #244 counted them, which was more than a third of what was open.
#
# The prefix is `blocked-on-`, and it is the prefix rather than any one name
# that carries the meaning: a pass that subtracts waiting issues matches the
# prefix, so a member added below is subtracted on the day it is first applied.
#
# WHAT A MEMBER NAMES IS THE KIND OF THING WAITED ON, never how long the wait
# is. There are three because three kinds were read across this board's open
# issues and no fourth was: another issue here, a decision nobody has taken,
# and an event outside this repository. A fourth member is added the day a
# fourth kind is read, in the same change that first applies it.
#
# THAT DID NOT HAPPEN, AND IT IS REPAIRED FIVE DAYS LATE RATHER THAN AT THE TIME.
# The fourth kind was read and applied on this board on 2026-09-01 and no member
# here declared it until #349. What the delay cost is written at the member
# itself, because that is where somebody meets it.
#
# MORE THAN ONE MEMBER IS LEGAL AND IS NOT A MISTAKE. An issue held by two
# kinds of wait carries both, because dropping either one makes the issue read
# as ready on the day the other clears.
#
# WHEN ONE IS APPLIED. Only when every condition of the issue that is not
# already met waits on the same thing outside the issue. An issue with a half
# that can still be worked carries none of these, because the label would hide
# that half from every pass rather than describe it.
#
# A MEMBER SAYS THAT AN ISSUE WAITS AND NEVER WHAT IT WAITS FOR. What it waits
# for belongs in the issue, in its own words, with the reading behind it. A
# label carrying that detail would be a second copy of the sentence, and the
# copy is the one that goes stale.
#
# WHETHER AN ISSUE CARRYING ONE MAY STILL BE PICKED UP: not as work. A pass
# that meets one moves on to the next issue. A reader who believes the wait has
# ended reads the thing that holds the answer and removes the label, which is
# the whole of what picking it up means while it carries one.
#
# WHAT REMOVES EACH ONE is written at that member rather than here, because a
# rule for taking a label off is read by somebody looking at the label. Nothing
# takes one off on its own. No route in this tree reads these labels, no run
# applies one and no run clears one, so a member that outlives its wait is a
# false statement about which issues are stuck, and it is the failure this
# family has that the absence it replaces did not.
- name: blocked-on-issue
  color: 'd4c5f9'
  description: Waiting on other work on this board, named in the issue
  # Removed when every issue it named has closed, by whoever closes the last of
  # them. The names live in the issue rather than in the label, so removing it
  # is a reading of those issues' states and not a memory of them.

- name: blocked-on-decision
  color: 'd4c5f9'
  description: Waiting on a decision, not on a piece of work
  # Removed when the decision has been taken and written onto the board, in the
  # same act. What the member names is the kind of wait and never who ends it,
  # so a decision I have not taken and one taken somewhere else hold an issue
  # the same way, and which of the two it is belongs in the issue's own words.
  #
  # THIS ENTRY NAMED A LABEL THE BOARD DOES NOT CARRY. The member written
  # above is the one the board holds; the entry named a member describing a
  # person from outside, which is what #284 removes, and the declaration went
  # on standing after the board had moved:
  #
  #     gh label list --repo Flowfin/jellyfin-plugin-watchlist --limit 100 \
  #       --json name --jq '[.[].name | select(startswith("blocked-on-"))]'
  #     ["blocked-on-issue","blocked-on-decision","blocked-on-upstream"]
  #
  # THAT OUTPUT IS THE READING TAKEN WHEN #284 WAS WRITTEN AND IT NO LONGER
  # REPRODUCES. The board has carried a fourth member since, so the same command
  # returns four names today. The three are kept because the account below is
  # about which name this entry declared then, and re-running the command here
  # would answer a different question; the header carries the current reading.
  #
  # What that cost, while a sync still ran, was the header's own rule pointed
  # back at this file: `delete-other-labels` removed a label neither
  # configuration named, so the next scheduled run would have deleted the
  # board's member off every issue holding it and created an unused one under
  # the name this entry declared before #284:
  #
  #     gh issue list --repo Flowfin/jellyfin-plugin-watchlist --state all \
  #       --limit 300 --label blocked-on-decision --json number,state \
  #       --jq '.[] | "\(.number) \(.state)"'
  #     277 OPEN
  #     134 OPEN
  #
  # Nothing here reads a declared name back against the board, so the next
  # divergence is found the way this one was, by somebody looking. The next one
  # was: it was read and measured on #343, and #349 removed it by declaring the
  # member below. Nothing about that route changed - the one after it will be
  # found by somebody looking too.

- name: blocked-on-upstream
  color: 'd4c5f9'
  description: Waiting on a release or a change outside this repository
  # Removed when the outside event has happened, read from the place that
  # publishes it rather than from anybody's recollection of it. This is the
  # member with no owner on this board: nobody here can schedule the event, so
  # nobody here is late while it carries this.

- name: blocked-on-dependency
  color: 'd4c5f9'
  description: Waiting on another issue or on a state of the tree, not on a person
  # The colour and the description are the ones the board already carries, read
  # off it rather than chosen again, which is the rule at the top of this file:
  #
  #     gh label list --repo Flowfin/jellyfin-plugin-watchlist --limit 100 \
  #       --json name,color,description \
  #       --jq '.[] | select(.name == "blocked-on-dependency")
  #             | "\(.color)\t\(.description)"'
  #     d4c5f9	Waiting on another issue or on a state of the tree, not on a person
  #
  # Removed when the thing it waits on has arrived, read from the issue or from
  # the tree rather than from a memory of either. It is the member closest to
  # `blocked-on-issue` above and is not the same: that one waits on WORK ON THIS
  # BOARD named in the issue, this one also covers a state of the tree that no
  # issue owns. Where the wait really is another issue here, the one above is the
  # narrower and better name.
  #
  # WHAT ITS ABSENCE COST IS WHY THIS ENTRY EXISTS AT ALL. It was applied on this
  # board on 2026-09-01 and declared nowhere until #349 on 2026-09-06. While the
  # scheduled sync still ran, `delete-other-labels` removed a label neither
  # configuration named and would have taken it off every issue holding it; that
  # run is recorded in `docs/parity.md` and the sync is gone, so the cost today is
  # smaller and of a different kind - a declaration that was false about the board
  # it declares, read by no run, found only because somebody looked.
