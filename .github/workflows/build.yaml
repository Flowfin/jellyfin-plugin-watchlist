name: '🏗️ Build Plugin'

# No paths filter, deliberately. `call / build` is one of the contexts the
# ruleset on master requires, and a required context that never reports is not
# a context that passed: the pull request waits for it and is refused. Excluding
# markdown here saved a build on a change that could not have broken one, and it
# cost the ability to merge a documentation change at all. Putting the exclusion
# back reopens that, so do not, unless the requirement moves with it.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

jobs:
  call:
    # jellyfin/jellyfin-meta-plugins has no tags, so the pin carries the date of
    # the commit instead of a version. Its build job checks out, sets up .NET,
    # runs jprm and uploads an artifact, none of which writes through the token.
    permissions:
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
