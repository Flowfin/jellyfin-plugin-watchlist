# Raises a tracking issue when a publish run leaves a release nobody can install.
#
# THE CASE THIS IS FOR. A release pipeline that fails loudly is fine. The one worth
# planning for reports success and ships nothing, and it has happened to a plugin
# release pipeline built the same way. `.github/workflows/publish.yaml` refuses
# several shapes that end in a half-published release, and every one of those steps
# judges its own inputs. None of them judges the release, which is the thing a user
# receives, so a run whose last steps did not happen ends green with a release that
# is absent, still a draft, or missing half its assets, and nothing says so.
#
# It watches from outside rather than being a step inside the publish route. A step
# that runs at the end of a job cannot report on a job that stopped before reaching
# it, which is exactly the case here, and `workflow_run` fires on a completed run
# whatever it concluded.
#
# WHAT IT DOES NOT COVER, AND THIS IS HALF OF WHAT #78 ASKS FOR. The second
# condition there asks the alert to cover the scheduled manifest check as well as
# the publish itself. That check is #89 and does not exist, so there is no second
# workflow to name in the trigger below, and this file covers one of the two
# subjects rather than both.
#
# WHAT IS PROVEN AND WHAT IS NOT. The judgement is proven: every shape it alerts on
# and every shape it stays silent on run as probes in the job below, ahead of the
# real reading, and the probe includes the one-change neighbour of the case that
# looks least like a failure. What is NOT proven is the raising itself. Opening an
# issue is one API call at the end, no publish run has ever happened here, and a
# deliberately broken publish costs a tag - a version number spent, which is the
# cost #134 names for the same reason. So the path from a verdict to an issue on the
# tracker has never been watched, and this paragraph says so rather than leaving a
# green probe to imply otherwise.
name: Publish outcome alert

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]
  # So the probes can be run on demand without a tag being spent. This route makes
  # no judgement and raises nothing; it runs the probes and stops.
  workflow_dispatch:

# Deny everything at the workflow level; the job below takes only what it needs.
permissions: {}

jobs:
  judge:
    name: Report a publish that shipped nothing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read the tree for the script, read the run that finished, and write the one
      # issue this exists to raise. Nothing here writes to the repository.
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Prove the judgement bites before it is trusted
        # Ahead of the reading that matters, which is the ordering every guard in
        # this repository uses. A judge that had stopped alerting would report a
        # healthy release exactly like one that is holding, and this is the check
        # whose whole purpose is to break a silence.
        run: |
          set -euo pipefail
          bash .github/scripts/judge-a-publish-run.sh --prove-it-bites

      - name: Judge what the publish left behind
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The release for the tag the run published, or the fact that there is
          # none. Anything other than a clean 200 or 404 leaves the report without
          # an answer, and the judge refuses a report without one rather than
          # reading silence as a healthy release.
          code="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/releases/tags/${RUN_TAG}")"

          case "${code}" in
            200)
              jq -n --slurpfile r release.json \
                 --arg id "${RUN_ID}" --arg url "${RUN_URL}" \
                 --arg conclusion "${RUN_CONCLUSION}" --arg tag "${RUN_TAG}" \
                 '{run: {id: $id, html_url: $url, conclusion: $conclusion, tag: $tag},
                   release: {found: true,
                             draft: ($r[0].draft // false),
                             assets: [$r[0].assets[]?.name]}}' > report.json
              ;;
            404)
              jq -n --arg id "${RUN_ID}" --arg url "${RUN_URL}" \
                 --arg conclusion "${RUN_CONCLUSION}" --arg tag "${RUN_TAG}" \
                 '{run: {id: $id, html_url: $url, conclusion: $conclusion, tag: $tag},
                   release: {found: false}}' > report.json
              ;;
            *)
              echo "::error::Asking for the release of ${RUN_TAG} returned HTTP ${code}. This alert judges nothing on an unclear answer rather than reporting a healthy release."
              exit 1
              ;;
          esac

          verdict=0
          bash .github/scripts/judge-a-publish-run.sh --report report.json > findings.txt || verdict=$?

          case "${verdict}" in
            0)
              echo "The release for ${RUN_TAG} is complete. Nothing to raise."
              exit 0
              ;;
            1) ;;
            *)
              echo "::error::The publish report could not be judged. Failing rather than reporting a healthy release."
              exit 1
              ;;
          esac

          # Keyed on the run so the same run cannot raise twice, and so closing the
          # issue for one run suppresses nothing for the next: a later run has a
          # later id and therefore a different title. The listing is read rather
          # than the search index, because the index lags behind a newly created
          # issue and the whole point of the key is that it is exact. It reads the
          # newest 200 issues of any state, which is a bound rather than a
          # guarantee: on a board that has moved 200 issues since this one, a
          # second alert for the same run would be raised.
          title="Publish run ${RUN_ID} reported ${RUN_CONCLUSION} and did not ship a complete release"
          existing="$(gh issue list --repo "${REPOSITORY}" --state all --limit 200 \
            --json number,title \
            | jq -r --arg t "${title}" '.[] | select(.title == $t) | .number' | head -n 1)"

          if [ -n "${existing}" ]; then
            echo "Already raised as #${existing}. This alert does not raise a second issue for one run."
            exit 0
          fi

          {
            echo "The publish route for \`${RUN_TAG}\` finished and what it left is not a release anybody can install."
            echo
            echo "Run: ${RUN_URL}"
            echo "Workflow: ${RUN_WORKFLOW}"
            echo "Conclusion the run reported: \`${RUN_CONCLUSION}\`"
            echo
            echo "## What was expected and is not there"
            echo
            cat findings.txt
            echo
            echo "## How this was read"
            echo
            echo "The asset names came from \`GET /repos/${REPOSITORY}/releases/tags/${RUN_TAG}\` and the judgement from \`.github/scripts/judge-a-publish-run.sh\`, whose probes ran in this same job before the reading. What the publish route attaches, and therefore what is missing above, is read off \`.github/workflows/publish.yaml\` rather than decided here."
            echo
            echo "## What this does not say"
            echo
            echo "Nothing here was downloaded or verified. The assets are judged by name and by count, so an archive that is present and corrupt reads as present. Whether the release installs is #76."
            echo
            echo "Refs #78."
          } > body.md

          gh issue create --repo "${REPOSITORY}" \
            --title "${title}" \
            --body-file body.md \
            --label ci --label "area: release" \
            --milestone "M10 Release and catalogue readiness" \
            --assignee iderex

          echo "::error::The publish run ${RUN_ID} did not ship a complete release. An issue has been raised."
          exit 1
