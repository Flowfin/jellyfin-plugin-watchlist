name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

jobs:
  call:
    # The analyse job checks out, builds, and uploads a CodeQL database, which
    # needs security-events write. actions read is what the CodeQL uploader uses
    # to find the workflow run it is reporting against.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    with:
      repository-name: jellyfin/jellyfin-plugin-template
