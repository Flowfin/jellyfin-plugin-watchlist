# Code scanning over this plugin's own C#.
#
# This workflow used to delegate to jellyfin/jellyfin-meta-plugins and pass the
# template's repository name into a guard that compares it with the repository the
# run is in, so the job was skipped on every event this repository ever produced
# and no line of this tree had been read by code scanning. The check was green in
# the sense that it was not red, which is the worst way for an instrument to be
# missing. #53 measured it and #57 is this.
#
# It is written here rather than called from elsewhere for one reason: the check
# context is the job name, and #63 is going to require a context by name. A name
# that lives in another repository can be renamed by somebody who has no way to
# know this mainline requires it, and the failure that produces is a required
# context that never reports, which refuses every pull request until a person
# notices. The name below is in the tree that depends on it.
#
# No paths filter, deliberately, and for the reason build.yaml and test.yaml carry
# in their own comments. A required context that never reports is not a context
# that passed: the pull request waits for it and is refused. The upstream workflow
# this replaces excluded markdown, which would have made a documentation change
# unmergeable the day #63 required this.
name: Code scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A weekly run so a query pack that learns something new says so against a tree
  # nobody has touched, rather than waiting for the next change.
  schedule:
    - cron: "24 2 * * 4"
  workflow_dispatch:

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

# A new push replaces the run under way. An analysis of a superseded tree says
# nothing about the branch as it now stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # This name is the check context. Changing it removes a context rather than
    # renaming one, so it is changed only together with whatever requires it.
    name: Code scanning (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The upload of the analysis, which is the whole output of this job.
      security-events: write
      # What the uploader reads to find the workflow run it reports against.
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          # The default pack finds security faults. This one adds the quality
          # queries beside them, which is what the other board's scan runs, and
          # comparing the two boards is only meaningful if they run the same set.
          queries: +security-and-quality

      - name: Build what is scanned
        # Built by name rather than by autobuild. Autobuild guesses, and a guess
        # that quietly compiles less than the tree holds is an analysis of part of
        # the source reported as an analysis of it. This compiles the solution,
        # which is both projects, and a build that fails stops the job instead of
        # producing an analysis of whatever did compile.
        #
        # Restore is locked, as it is everywhere in this tree, so the graph this
        # analysis reads is the graph in the lock files rather than whatever the
        # feed offered on the day the scan ran.
        run: |
          set -euo pipefail
          dotnet restore Jellyfin.Plugin.Watchlist.sln
          dotnet build Jellyfin.Plugin.Watchlist.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:csharp"
