# The label sync, pointed at two configurations instead of one.
#
# This file called `jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml`
# until #196. That workflow passes one config file and `delete-other-labels: true`,
# and it accepts nothing but a token, so a caller cannot add to the set it reads
# and cannot ask it for a preview:
#
#     gh api "repos/jellyfin/jellyfin-meta-plugins/contents/.github/workflows/sync-labels.yaml?ref=eb99033a7ff644881b014bc0b4169916c854a68b" \
#       --jq .content | tr -d '\n' | base64 -d
#
# Nine of the twenty labels this board uses are named by that config neither as a
# label nor as an alias of one, so the first run would have deleted every one of
# them, including the whole `area:` vocabulary. The counts and the commands
# behind them are on #196.
#
# The action itself takes several config files, so the shared set is still read
# from its own URL and this repository's own labels are added beside it rather
# than copied into it. `delete-other-labels` is kept, because removing a label
# nobody declared is what this sync is for; what changed is that this board's
# labels are now declared.
#
# What this file does NOT decide is whether this board should keep a vocabulary
# of its own or move onto the shared one. That question is still open and #196
# says so in its own words. Keeping both sets is the state the board is already
# in, so nothing here forecloses it.
name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report the changes without making them'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Labels live behind the issues API, so writing them is issues write.
      issues: write
      # The second config file is in this tree and has to be checked out. The
      # shared one is fetched over plain HTTP by the action.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          # The shared set first, then this board's own. The shared one is a URL
          # to a branch, so a run applies whatever it holds on the day it runs;
          # that is the same reading the call into the shared workflow had.
          config-file: |
            https://raw.githubusercontent.com/jellyfin/jellyfin-meta-plugins/master/.github/plugin-repo-labels.yaml
            .github/labels.yaml
          delete-other-labels: true
          # A run started by hand previews by default and applies only when asked,
          # because the destructive direction is the one worth having to type. The
          # scheduled run carries no inputs, so the expression is false there and
          # the monthly sync applies as it always did.
          dry-run: ${{ inputs.dry-run == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
