# The headless rule refuses a test that needs a display, elevation, a machine
# trust store, the network or the machine clock. A guard in the suite refuses
# those calls by reading the sources, and reading the sources is not the same as
# running the suite somewhere the calls would fail. The gate's own test leg runs
# on Linux only, so a departure that only bites on another platform, a path
# separator, a case-insensitive file system, a locale, would land green.
#
# This job runs the suite once on each of the three platforms the rule names and
# reports the privilege the run had, so what each leg is worth is a reading rather
# than a claim.
#
# The hosted Linux and macOS images run the job unprivileged, so those two legs
# say "green as an unprivileged user" with nothing else needed. The hosted
# Windows image runs the job under an account holding the built-in Administrators
# role, and a suite that needs elevation passes under such an account exactly
# like one that does not. So the Windows leg drops that role before it starts the
# suite and reads the privilege inside the process that runs it, rather than
# beside it. Jellyfin.Plugin.Watchlist.Tests/HEADLESS.md carries the readings.
#
# It reports and does not gate. Which checks the mainline requires is decided in
# M8, on #63.
name: Suite on every platform

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Deny everything at the workflow level; the job below takes only what it reads.
permissions: {}

# A new push replaces the run under way. A matrix that has already been
# superseded proves nothing about the branch as it now stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      # Every platform reports. Stopping the others at the first red would hide
      # whether a failure is one platform's or all of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        # One shell on all three, so the steps below are one script rather than a
        # bash script and a PowerShell script that have to be kept in agreement.
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Say which server lines this run covers
        # This repository claims two supported server lines and carries a package
        # set for one, so every leg here covers half of what is supported and a
        # green tick says nothing about the other half. The step prints which line
        # the run built, read out of the manifest and the project rather than
        # written here, and says in the same breath that the rest of the supported
        # set is absent from this run rather than reported by it.
        #
        # The probe runs first, which is the ordering the package check and the
        # invariant lint already use. A reading that had stopped refusing what it
        # cannot read would print nothing and pass exactly like one that is
        # holding.
        run: |
          set -euo pipefail
          bash .github/scripts/say-which-server-lines-this-run-covers.sh --prove-it-bites
          echo
          bash .github/scripts/say-which-server-lines-this-run-covers.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Report the privilege this run has
        # Read only, and it never fails the job. The point is that the log says
        # what the run was rather than leaving the reader to assume it. On a
        # POSIX runner uid 0 is root; on Windows the answer is whether the token
        # carries the built-in Administrators role.
        #
        # This is the job's own token. On Windows it is not the token the suite
        # runs under, because the step that runs the suite drops the role first
        # and takes its own reading there.
        #
        # The reading also goes to the job summary, and an elevated reading takes
        # the sentence that says what it costs with it. A green suite under an
        # administrator token looks exactly like a green suite under an ordinary
        # one, so a reader who meets only the tick has been told nothing about
        # the half of the rule that is about elevation. The hosted Windows image
        # is elevated today, which is why this sentence exists rather than being
        # a precaution.
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows)
              reading=$(powershell -NoProfile -NonInteractive -Command \
                '$p = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent()); Write-Output ("user=" + [Security.Principal.WindowsIdentity]::GetCurrent().Name + " elevated=" + $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))')
              ;;
            *)
              reading="user=$(id -un) uid=$(id -u) elevated=$([ "$(id -u)" -eq 0 ] && echo true || echo false)"
              ;;
          esac
          echo "${reading}"
          {
            echo "### Privilege on ${RUNNER_OS}"
            echo
            echo "    ${reading}"
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${reading}" in
            *elevated=[Tt]rue*)
              {
                echo
                echo "The job's own token is elevated, so a green suite under it would not say whether the suite needs elevation. The suite step below runs under a token without that role and prints its own reading. Which half of the rule each reading covers is recorded in Jellyfin.Plugin.Watchlist.Tests/HEADLESS.md."
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
          esac

      - name: Restore and build
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run the suite
        # On Linux and macOS the job's own token is the unprivileged one the step
        # above read, so the suite runs directly under it.
        #
        # On Windows it is not. `runas /trustlevel:0x20000` starts a process at
        # the normal user level, where the built-in Administrators group is
        # present in the token for denial only, so a call that needs the role is
        # refused exactly as it would be for an ordinary account. It is the same
        # account, the same profile and the same package cache, with one
        # privilege fewer, and it asks for no password and creates nothing on the
        # machine.
        #
        # The privilege is read by that process rather than beside it. A reading
        # taken in the step and a suite run somewhere else are two runs, and the
        # question this leg exists for is what the suite itself had.
        #
        # runas returns as soon as it has started the command and the console it
        # starts is not this one, so everything the run produces goes to files and
        # the exit status comes back as one of them. No status file after the wait
        # is a failure and never a pass.
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" != "Windows" ]; then
            dotnet test --configuration Release --no-build --verbosity normal
            exit 0
          fi

          out="$(cygpath -u "${RUNNER_TEMP}")/unprivileged-suite"
          rm -rf "${out}"
          mkdir -p "${out}"
          win_out="$(cygpath -w "${out}")"
          work="$(cygpath -w "${PWD}")"
          dotnet_exe="$(cygpath -w "$(command -v dotnet)")"
          case "${dotnet_exe}" in
            *.exe) ;;
            *) dotnet_exe="${dotnet_exe}.exe" ;;
          esac

          cat > "${out}/suite.cmd" <<CMD
          @echo off
          cd /d "${work}"
          powershell -NoProfile -NonInteractive -Command "\$p = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent()); Write-Output ('elevated=' + \$p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))" > "${win_out}\reading.txt" 2>&1
          "${dotnet_exe}" test --configuration Release --no-build --verbosity normal > "${win_out}\suite.log" 2>&1
          set rc=%ERRORLEVEL%
          rem The redirection comes first because a digit written immediately
          rem before it is read as a stream number and not as text, which leaves
          rem an empty file where the status should be.
          > "${win_out}\code.txt" echo rc=%rc%
          CMD

          runas /trustlevel:0x20000 "cmd.exe /c \"${win_out}\\suite.cmd\""

          waited=0
          while [ ! -f "${out}/code.txt" ] && [ "${waited}" -lt 900 ]; do
            sleep 5
            waited=$((waited + 5))
          done

          if [ -f "${out}/suite.log" ]; then
            cat "${out}/suite.log"
          fi

          if [ ! -f "${out}/code.txt" ]; then
            echo "The suite under the filtered token left no exit status after ${waited}s. Nothing here reads that as a pass."
            exit 1
          fi

          reading="$(tr -d '\r\n' < "${out}/reading.txt")"
          echo "the process that ran the suite: ${reading}"
          {
            echo "### The suite's own token on ${RUNNER_OS}"
            echo
            echo "    ${reading}"
          } >> "${GITHUB_STEP_SUMMARY}"

          case "${reading}" in
            elevated=False) ;;
            *)
              echo "The suite was to run without the built-in Administrators role and this reading does not say so. Refusing the leg rather than reporting a green under an unknown privilege."
              exit 1
              ;;
          esac

          code="$(tr -dc '0-9' < "${out}/code.txt")"
          if [ -z "${code}" ]; then
            echo "The status file holds no number: $(cat "${out}/code.txt")"
            exit 1
          fi
          echo "the suite exited ${code}"
          exit "${code}"
