# Drive the whole watchlist loop on a real server, with the packaged plugin
# installed the way a server installs one (#52).
#
# WHAT THIS ADDS THAT THE INTEROPERABILITY MATRIX DOES NOT. That matrix boots the
# same image with the same archive and asserts that the plugin loads, is listed
# active, answers three routes and collides with nothing. It adds no item, runs no
# projection and reads no playlist, and says so in its own header. So until this
# job existed, every green run on this board left "a client sees the list" as a
# claim about source: the scheduled task the projection is driven by, the playlist
# manager it writes through and the library the endpoints refuse an unknown item
# against had never been executed anywhere.
#
# THE HARNESS IS A FIRST-PARTY SCRIPT IN THE TREE, for the reason the boot harness
# and the dependency listing are: the gate should be readable here, and it should
# run the same way on a workstation with a container runtime as it does on a
# runner.
#
#   .github/scripts/drive-the-whole-loop-on-a-line.sh \
#     --image jellyfin/jellyfin:10.11.11 --package <package.zip>
#
# TWO PROBES RUN AHEAD OF THE RUN THAT MATTERS, which is the ordering every other
# guard in this repository uses. A harness that asserted nothing would pass the
# real run exactly like one that is holding.
#
#   The four judgements the harness decides with run over fabricated answers and
#   their one-change neighbours. No container.
#
#   The harness is pointed at the same image and the same archive with the
#   projection turned off through the plugin's own configuration route, and must
#   refuse it FOR THE PLAYLIST NEVER APPEARING rather than merely exit non-zero.
#   That proves the assertion the loop is about, on a live server, against the one
#   setting that decides it.
#
# ONE LINE IS BOOTED AND THE RUN SAYS SO, which is the reading the build, test,
# dependency and interoperability legs already take, taken here for their reason:
# the tree carries one package set, and a second line arrives with a second one
# rather than with a second entry in this file.
#
# WHERE THIS BELONGS IN THE GATE. On a schedule, on demand, at a release across
# every supported line, and with the log and the transcript published as artifacts
# of the run - that is #62 and is decided here: a pull request that can move what
# the harness asserts, a weekly schedule, on demand, and a release. Each trigger
# carries its own reason at the trigger rather than in a list.
#
# THE RELEASE RUN IS NOT A TRIGGER IN THIS FILE ANY MORE, AND THAT IS #310. It was
# a `push` on the tag patterns `publish.yaml` triggers on, which started this
# workflow beside the publishing chain rather than ahead of it: two workflows on
# one event, neither waiting, so a release could be created while this was still
# booting its server and a red run could arrive after the archive was public. The
# tag patterns are gone from here and `publish.yaml` calls this file as a job its
# build needs. So a tag runs this once, inside the chain, and the chain does not
# reach the release without it.
#
# WHAT A FAILURE LEAVES BEHIND. The harness writes the container log and the
# transcript of every call it made into a directory, on every path it can exit by,
# and the job uploads that directory whether the run passed or failed. A red run is
# therefore readable a month later, when the step log has scrolled past and the
# server it was about is long gone.
#
# WHAT IT GATES IS A RELEASE AND NOT THE MAINLINE, and the two are worth keeping
# apart. On a pull request, on the schedule and on a dispatch this reports: a red
# run here does not stop a merge, because which checks the mainline requires is
# decided on #63 and the required set is read rather than restated below. On a
# release it gates, because `publish.yaml` calls it as a job its build needs.
#
#     gh api repos/Flowfin/jellyfin-plugin-watchlist/rulesets/20456281 \
#       --jq '[.rules[] | select(.type=="required_status_checks")
#              | .parameters.required_status_checks[].context]'
name: Whole loop

on:
  # A pull request that can move what the harness asserts. That set is the harness
  # and this file, `build.yaml` - whose declared identity and line the harness
  # asserts against, and whose version names the archive - and the plugin itself,
  # which is what the loop is a reading of. A trigger narrowed to the harness alone
  # would be a check that guards only itself: a change to the projection that broke
  # the loop would meet nothing on the pull request introducing it, and would be
  # found by the schedule below, after the merge.
  pull_request:
    branches:
      - master
    paths:
      - ".github/scripts/drive-the-whole-loop-on-a-line.sh"
      - ".github/workflows/whole-loop.yaml"
      - "build.yaml"
      - "Jellyfin.Plugin.Watchlist/**"
  # What this reads is a published server image and a container runtime rather than
  # this tree alone, so a run that passed on the day of a merge says nothing about
  # the image the same tag resolves to a month later. That is the failure a check
  # wired only to changes cannot see, and it is why this one is not.
  schedule:
    - cron: "0 4 * * 1"
  # On demand, so a reading can be taken against a commit somebody is about to tag
  # without waiting a week for the schedule or pushing a change to force one.
  workflow_dispatch:
  # At a release, as a job `publish.yaml` calls rather than as a second workflow on
  # the same tag push. The caller checks out the ref the tag names, so the loop is
  # driven against exactly the commit an artifact is cut from, and `build` there
  # needs this job, so the evidence exists BEFORE the archive is published rather
  # than beside it. That is #62's condition and #310 is where it was taken.
  workflow_call:
    inputs:
      deliberately-fail-the-loop:
        description: "Fail this job before it boots anything, to prove that a red loop still reaches the alert that reports a publish which shipped nothing."
        type: boolean
        default: false
        required: false

# Deny everything at the workflow level; the job below takes only what it reads.
permissions: {}

# A superseded run on the same ref tells nobody anything, and this one holds a
# container runtime for the length of two server boots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    # This name is the check context. Changing it removes a context rather than
    # renaming one, so it moves only together with whatever requires it.
    name: Whole loop on ${{ matrix.line }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the tree the package is built from
    strategy:
      fail-fast: false
      matrix:
        include:
          # build.yaml declares targetAbi 10.11.0.0, and 10.11.11 is the newest
          # image published on that line, so this job boots a server the manifest
          # claims to load on. The tag is where the version is read from: a
          # floating tag would move this job onto a server nobody chose.
          - line: "10.11"
            framework: net9.0
            image: "jellyfin/jellyfin:10.11.11"

    steps:
      - name: Fail on purpose, if the caller asked for a red loop
        # The first step, so this costs no image pull and no container. What it
        # exists for is #310's second condition: after the loop became something
        # the publishing chain needs, a red loop must still end in the alert that
        # reports a publish which shipped nothing, and a green run of the new
        # arrangement demonstrates nothing about that. Only a caller can set this
        # - `workflow_call` inputs are not settable from a push, a schedule or a
        # dispatch of this file - so no route that publishes anything can reach it.
        if: inputs.deliberately-fail-the-loop
        run: |
          set -euo pipefail
          echo "::error::This job was failed on purpose by its caller. Nothing was booted and nothing was read. It exists so that the publishing chain can be watched refusing to reach a release when the loop is red."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Say which server lines this run covers
        # One line is booted and the tree supports two. Without this step a green
        # tick here reads as a statement about both.
        run: |
          set -euo pipefail
          bash .github/scripts/say-which-server-lines-this-run-covers.sh --prove-it-bites
          echo
          bash .github/scripts/say-which-server-lines-this-run-covers.sh

      - name: Say what this job is booting
        env:
          LINE: ${{ matrix.line }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "Server line: ${LINE}"
          echo "Image:       ${IMAGE}"
          grep -n '^targetAbi:\|^framework:' build.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Build the package this job installs
        id: jprm
        # The same packager and the same pin the release route runs. No version
        # input: the packager reads it out of build.yaml, which is the only place
        # the version is written.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: ${{ matrix.framework }}

      - name: Prove the harness bites before it is believed
        run: |
          set -euo pipefail
          bash .github/scripts/drive-the-whole-loop-on-a-line.sh --prove-it-bites

      - name: Prove the harness refuses a server whose projection is off
        # This step passes when the harness REFUSED, and the inversion lives
        # inside the script rather than here on purpose. A step written as "run it
        # and expect a non-zero exit" accepts a harness that died before it
        # asserted anything. The script knows which failure it raised; a shell
        # here knows only the exit status.
        env:
          IMAGE: ${{ matrix.image }}
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          set -euo pipefail
          bash .github/scripts/drive-the-whole-loop-on-a-line.sh \
            --image "${IMAGE}" --package "${ARTIFACT}" --port 18099 \
            --collect collected/near-miss \
            --without-the-projection

      - name: Drive the whole loop
        env:
          IMAGE: ${{ matrix.image }}
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          set -euo pipefail
          bash .github/scripts/drive-the-whole-loop-on-a-line.sh \
            --image "${IMAGE}" --package "${ARTIFACT}" \
            --collect collected/loop

      - name: Publish the server log and the request transcript
        # `always()`, because the run this is worth having is the one that failed,
        # and the default condition skips exactly that one. The harness writes both
        # files from its exit trap, so a refusal midway through the loop still
        # leaves the transcript of what it had asked by then.
        #
        # A run that died before the harness started leaves nothing here, and the
        # upload warns rather than failing: an empty upload is not evidence that the
        # loop was clean, and this step is not the thing that decides the job.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whole-loop-${{ matrix.line }}
          path: collected/
          if-no-files-found: warn
          retention-days: 30
