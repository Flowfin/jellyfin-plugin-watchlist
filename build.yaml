---
name: "Watchlist"
guid: "6e1631d7-aa49-494d-a23b-d5785853fc0a"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-watchlist/master/img/logo.png"
# The version is written here and nowhere else. Directory.Build.props reads it out
# of this file and stamps the assembly version, the file version and the package
# version from it, so the number the dashboard shows and the number in the package
# cannot drift apart.
#
# Four numeric positions and no suffix. A server parses this string into a
# System.Version, and a string it cannot parse is not refused: it is quietly replaced
# with the server's own minimum, so "1.0.0.0-rc1" would install as something else
# entirely.
#
#     git show v10.11.11:Emby.Server.Implementations/Plugins/PluginManager.cs | sed -n '697,700p'
#                         if (!Version.TryParse(manifest.Version, out version))
#                         {
#                             manifest.Version = _minimumVersion.ToString();
#                         }
#
# What each position means:
#
#   major   raised when an upgrade needs something from the person doing it, and
#           held at 1 for the release the milestones are written towards.
#   minor   behaviour added that needs nothing from anybody.
#   patch   fixes only.
#   build   the same source packaged again.
#
# A pre-release cannot be said in the number, because the number takes no suffix. A
# major of 0 is what says the feature set called 1.0 is not finished; anything finer
# belongs to the release and not to this string.
#
# 0.1.0.0, not the 1.0.0.0 this file inherited from the upstream template, which
# ships that value unchanged in every copy of it:
#
#     gh api repos/jellyfin/jellyfin-plugin-template/contents/build.yaml \
#       --jq '.content' | base64 -d | grep '^version:'
#     version: "1.0.0.0"
#
# Nothing here has been released and most of what the milestones describe is not
# built, so a 1 in the first position would be a claim rather than a number. 1.0.0.0
# is what the first release takes when those milestones close.
version: "0.1.1.0"
# The server line this artifact is built for, and it is a floor rather than a range.
# A server compares its own version against this value and offers the plugin when it
# is at least that, with no upper bound on either supported line:
#
#     git show v10.11.11:Emby.Server.Implementations/Plugins/PluginManager.cs | grep -n 'appVersion >= targetAbi'
#     702:                    return new LocalPlugin(dir, _appVersion >= targetAbi, manifest);
#
# So the value has to name the line the assembly was compiled against, and nothing on
# the server side will catch it if it does not. What holds it here is the suite:
# ServerLineTests reads this key and every Jellyfin package reference in the project
# file and reds when the two name different lines.
#
# 10.11, because that is the package set the project references. The 12.0 artifact is
# the other half of #4, and what it waits on is a stable 12.0 server release rather
# than a decision: answer 5 on #1, taken 2026-08-24, is that 1.0 ships this artifact
# alone and the 12.0 one follows that release. When it arrives it is a second manifest
# with its own ABI and its own framework, because one entry cannot claim two lines.
targetAbi: "10.11.0.0"
# The framework that line runs, taken from the package rather than chosen: the
# Jellyfin.Controller 10.11.11 nuspec declares a net9.0 dependency group, and the
# project targets net9.0.
#
# What holds the two together is PackageFrameworkTests, which reads this key and the
# TargetFramework of the project file and reds when they name different frameworks.
# Until it landed, the only reading of this pair was in the release route, against a
# constant written there, and that reading is taken once per tag. This value decides
# which directory the packaging tool takes the assembly out of, so a disagreement is a
# release that packages nothing or packages what an earlier build left behind.
framework: "net9.0"
overview: "A private per-user watchlist kept on the server and shown by clients that were never changed."
description: >
  Adds a watchlist to Jellyfin. Each user gets a private list, held on the
  server, so it is the same list on every device that user signs in from.
  The list is projected into a playlist owned by that user, which is a
  surface every stock client already renders, so nothing has to be patched,
  forked or installed alongside it.
category: "General"
owner: "Flowfin"
# The files the packaging tool takes out of the build output and puts in the archive.
# A name no build wrote is not a smaller package, it is a packaging step that finds
# nothing where it was told to look, and it finds nothing at the moment a tag is spent.
#
# What holds it here is PackageArtifactsTests, which reads this sequence and the name
# the compiled plugin assembly gives itself and reds when they name different files.
# The name comes off the assembly rather than off the project file, so an AssemblyName
# set anywhere reaches the comparison.
#
# One entry, because one project builds one assembly. The second server line gets a
# manifest of its own, for the reason written at targetAbi above.
artifacts:
- "Jellyfin.Plugin.Watchlist.dll"
# The text a server shows for this version is written in CHANGELOG.md and nowhere
# else. Before the package is built, the publish route replaces everything under
# this key with the CHANGELOG.md section for the version above, and refuses the run
# when there is no such section. So what a release ships is the changelog, and
# whatever stands here is overwritten on the way.
#
# The key stays rather than being deleted because the packaging tool reads it
# without a default and dies with a KeyError after the compile when it is absent,
# which is far past the point where the tag is spent. What stands under it is a
# pointer at the file the notes come from, and the suite refuses notes written here
# instead: two files carrying the same paragraph is a copy that goes stale against
# the one that ships, and this is the copy nobody reads.
changelog: >
  Written at package time from the CHANGELOG.md section for the version above.
  Nothing typed here reaches a release.
